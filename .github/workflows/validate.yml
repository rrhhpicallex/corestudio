name: Validate JS syntax

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JS syntax in index.html
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const matches = html.match(/<script>([\s\S]*?)<\/script>/g) || [];
            const js = matches.map(m => m.replace(/<\/?script>/g, '')).join('\n');
            try { new Function(js); console.log('JS syntax OK'); }
            catch(e) { console.error('Syntax error:', e.message); process.exit(1); }
          "
